<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepRise</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#141414;font-family:system-ui,sans-serif;color:#fff;padding:20px 20px 100px}
.app-header{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.app-icon{width:38px;height:38px;background:#2ECC71;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#0a2e18}
.app-name{font-size:16px;font-weight:700;color:#fff}
.greeting{font-size:24px;font-weight:700;color:#fff;margin-bottom:3px}
.greeting span{color:#2ECC71}
.date-text{font-size:13px;color:#666;margin-bottom:14px}
.week-badge{display:inline-flex;align-items:center;gap:6px;background:#1a2e1f;border:1px solid #2ECC71;border-radius:20px;padding:5px 14px;margin-bottom:10px}
.week-text{font-size:12px;color:#2ECC71;font-weight:600}
.prog-row{display:flex;justify-content:space-between;margin-bottom:5px}
.prog-label{font-size:11px;color:#666}
.prog-pct{font-size:11px;color:#2ECC71;font-weight:500}
.prog-bar{height:4px;background:#2a2a2a;border-radius:2px;margin-bottom:16px}
.prog-fill{height:4px;background:#2ECC71;border-radius:2px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:#1e1e1e;border-radius:12px;padding:12px 14px;border:1px solid #2a2a2a}
.stat-label{font-size:11px;color:#666;margin-bottom:4px}
.stat-value{font-size:24px;font-weight:700;color:#fff;line-height:1.1}
.stat-sub{font-size:11px;color:#2ECC71;margin-top:2px}
.section-label{font-size:10px;color:#555;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px}
.habit-row{display:flex;align-items:center;gap:6px;margin-bottom:16px}
.habit-dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.dot-active{background:#2ECC71;color:#0a2e18}
.dot-today{background:#1a2e1f;border:2px solid #2ECC71;color:#2ECC71}
.dot-inactive{background:#1e1e1e;border:1px solid #2a2a2a;color:#444}
.dot-missed{background:#1e1e1e;border:1px solid #3a2a2a;color:#553333}
.muscle-section{margin-bottom:16px}
.muscle-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.muscle-name{font-size:12px;color:#aaa;width:64px;flex-shrink:0}
.muscle-bar-bg{flex:1;height:5px;background:#2a2a2a;border-radius:3px}
.muscle-bar-fill{height:5px;border-radius:3px;transition:width 0.6s ease}
.muscle-pct{font-size:11px;color:#555;width:32px;text-align:right;flex-shrink:0}
.quote-box{background:#1a2a1a;border-left:3px solid #2ECC71;border-radius:0 8px 8px 0;padding:10px 12px;margin-bottom:16px}
.quote-text{font-size:12px;color:#888;line-height:1.6;font-style:italic}
.settings-section{background:#1e1e1e;border-radius:12px;padding:14px;margin-bottom:20px;border:1px solid #2a2a2a}
.settings-title{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.field-full{margin-bottom:8px}
.field label{font-size:10px;color:#666;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.05em}
.field input{width:100%;background:#141414;border:1px solid #333;border-radius:8px;padding:8px 10px;color:#fff;font-size:12px;outline:none}
.field input:focus{border-color:#2ECC71}
.save-btn{width:100%;background:#2ECC71;color:#0a2e18;border:none;border-radius:10px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;margin-top:4px}
.live-dot{display:inline-block;width:6px;height:6px;background:#2ECC71;border-radius:50%;margin-left:6px;vertical-align:middle;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
</head>
<body>

<div class="app-header">
  <div class="app-icon">R</div>
  <div class="app-name">RepRise</div>
</div>

<div class="greeting">Good <span id="time-greeting">morning</span>, <span id="user-name">Shoeb</span></div>
<div class="date-text" id="today-date"></div>

<div class="week-badge">
  <span class="week-text" id="week-badge-text">Week 1 of 8</span>
</div>

<div class="prog-row">
  <span class="prog-label">Program progress</span>
  <span class="prog-pct" id="prog-pct">—</span>
</div>
<div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>

<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-label">Sessions</div>
    <div class="stat-value" id="stat-sessions">—</div>
    <div class="stat-sub">this program</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Total sets</div>
    <div class="stat-value" id="stat-sets">—</div>
    <div class="stat-sub">logged</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Workout time</div>
    <div class="stat-value" id="stat-minutes">—</div>
    <div class="stat-sub">minutes</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Streak</div>
    <div class="stat-value" id="stat-streak">—</div>
    <div class="stat-sub">weeks active</div>
  </div>
</div>

<div class="section-label">This week</div>
<div class="habit-row" id="habit-dots"></div>

<div class="section-label">Muscle balance</div>
<div class="muscle-section" id="muscle-section"></div>

<div class="section-label">Daily quote <span class="live-dot" id="live-indicator" style="display:none"></span></div>
<div class="quote-box">
  <div class="quote-text" id="daily-quote">Loading…</div>
</div>

<div class="settings-section">
  <div class="settings-title">Program settings</div>
  <div class="field-full field">
    <label>Program name</label>
    <input type="text" id="prog-name" placeholder="e.g. Summer Shred 2026">
  </div>
  <div class="field-row">
    <div class="field">
      <label>Start date</label>
      <input type="date" id="start-date" oninput="updateProgress()">
    </div>
    <div class="field">
      <label>Duration (weeks)</label>
      <input type="number" id="duration" value="8" min="1" max="52" oninput="updateProgress()">
    </div>
  </div>
  <button class="save-btn" onclick="saveSettings()">Save settings</button>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
// Paste your deployed Web App URL here after deploying reprise_api.gs
var API_URL = 'https://script.google.com/macros/s/AKfycbx5mOxIXzhFO70FiTqlwcpUdJ5y9_3LD_aCP1PTv25JOMurpRcl6Q660qjneWlEE_Rb/exec';
var USER_EMAIL = 'khan.shoeb76@gmail.com';

// ─── MUSCLE COLORS ────────────────────────────────────────────────────────────
var MUSCLE_COLORS = {
  'Push':          '#2ECC71',
  'Pull':          '#27AE60',
  'Legs':          '#3498DB',
  'Core':          '#F39C12',
  'Cardio':        '#9B59B6',
  'Stretching':    '#1ABC9C',
  'Skills':        '#E67E22',
  'Miscellaneous': '#95A5A6'
};

// ─── INIT ─────────────────────────────────────────────────────────────────────
var today = new Date();
var hour  = today.getHours();

document.getElementById('time-greeting').textContent =
  hour < 12 ? 'morning' : hour < 17 ? 'afternoon' : 'evening';

document.getElementById('today-date').textContent =
  today.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

// Render habit dots immediately based on today (will be overwritten by live data)
renderHabitDots([false,false,false,false,false,false,false]);

// Render empty muscle bars placeholder
renderMuscleBalance([]);

// ─── LIVE DATA FETCH (JSONP — no CORS issues) ─────────────────────────────────
function fetchLiveData() {
  var callbackName = 'repriseData';
  var url = API_URL
    + '?email='    + encodeURIComponent(USER_EMAIL)
    + '&callback=' + callbackName;

  window[callbackName] = function(data) {
    delete window[callbackName];
    if (data.error) { console.warn('API error:', data.error); loadFromLocalSettings(); return; }
    applyLiveData(data);
  };

  var script = document.createElement('script');
  script.src = url;
  script.onerror = function() {
    console.warn('JSONP request failed — using local fallback');
    loadFromLocalSettings();
  };
  document.head.appendChild(script);
}

function applyLiveData(d) {
  // Name
  if (d.firstName) document.getElementById('user-name').textContent = d.firstName;

  // Stats
  document.getElementById('stat-sessions').textContent = d.totalSessions || 0;
  document.getElementById('stat-sets').textContent     = d.totalSets     || 0;
  document.getElementById('stat-minutes').textContent  = d.workoutMinutes || 0;
  document.getElementById('stat-streak').textContent   = d.streak         || 0;

  // Settings fields (populate from sheet, allow local override)
  if (d.programName) document.getElementById('prog-name').value = d.programName;
  if (d.startDate)   document.getElementById('start-date').value = d.startDate;
  if (d.durationWeeks) document.getElementById('duration').value = d.durationWeeks;

  // Progress bar (now we have real dates)
  updateProgress();

  // Habit dots
  if (d.habitGrid && d.habitGrid.length === 7) renderHabitDots(d.habitGrid);

  // Muscle balance
  if (d.muscleBalance && d.muscleBalance.length) renderMuscleBalance(d.muscleBalance);

  // Quote
  if (d.dailyQuote) {
    document.getElementById('daily-quote').textContent = '“' + d.dailyQuote + '”';
    document.getElementById('live-indicator').style.display = 'inline-block';
  }
}

// ─── RENDER HELPERS ───────────────────────────────────────────────────────────
var DAY_LABELS = ['S','M','T','W','T','F','S'];

function renderHabitDots(grid) {
  var container = document.getElementById('habit-dots');
  container.innerHTML = '';
  var todayDow = today.getDay();
  DAY_LABELS.forEach(function(label, i) {
    var dot = document.createElement('div');
    var cls;
    if (i === todayDow) {
      cls = grid[i] ? 'dot-active' : 'dot-today';
    } else if (i < todayDow) {
      cls = grid[i] ? 'dot-active' : 'dot-missed';
    } else {
      cls = 'dot-inactive';
    }
    dot.className = 'habit-dot ' + cls;
    dot.textContent = label;
    container.appendChild(dot);
  });
}

function renderMuscleBalance(groups) {
  var container = document.getElementById('muscle-section');
  container.innerHTML = '';

  if (!groups || !groups.length) {
    // Placeholder rows while loading
    ['Push','Pull','Core'].forEach(function(name) {
      container.appendChild(buildMuscleRow(name, 0, '#2a2a2a'));
    });
    return;
  }

  groups.forEach(function(g) {
    var color = MUSCLE_COLORS[g.name] || '#2ECC71';
    container.appendChild(buildMuscleRow(g.name, g.pct, color));
  });
}

function buildMuscleRow(name, pct, color) {
  var row = document.createElement('div');
  row.className = 'muscle-row';
  row.innerHTML =
    '<span class="muscle-name">' + name + '</span>' +
    '<div class="muscle-bar-bg">' +
      '<div class="muscle-bar-fill" style="width:' + pct + '%;background:' + color + '"></div>' +
    '</div>' +
    '<span class="muscle-pct">' + (pct ? pct + '%' : '—') + '</span>';
  return row;
}

// ─── PROGRESS ─────────────────────────────────────────────────────────────────
function updateProgress() {
  var startVal = document.getElementById('start-date').value;
  var dur      = parseInt(document.getElementById('duration').value) || 8;
  if (!startVal) return;

  var start    = new Date(startVal);
  var diffDays = Math.floor((today - start) / 86400000);
  var week     = Math.max(1, Math.floor(diffDays / 7) + 1);
  var pct      = Math.min(100, Math.round((diffDays / (dur * 7)) * 1000) / 10);

  document.getElementById('week-badge-text').textContent =
    'Week ' + Math.min(week, dur) + ' of ' + dur;
  document.getElementById('prog-pct').textContent  = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
}

// ─── FALLBACKS ────────────────────────────────────────────────────────────────
var STATIC_QUOTES = [
  "Train hard, recover harder.",
  "Your body can do it. It's your mind you have to convince.",
  "The only bad workout is the one that didn't happen.",
  "Push yourself because no one else is going to do it for you.",
  "Sore today, strong tomorrow.",
  "Your health is an investment, not an expense.",
  "Don't wish for it. Work for it.",
  "The pain you feel today is the strength you feel tomorrow.",
  "Fall in love with taking care of yourself.",
  "One workout at a time. One day at a time.",
  "Do something today that your future self will thank you for.",
  "Discipline is doing it even when you don't feel like it.",
  "You don't have to be extreme. Just consistent.",
  "Every rep brings you closer to the person you want to become.",
  "Sweat is just fat crying.",
  "Success starts with self-discipline.",
  "Wake up. Work out. Be happy.",
  "Fitness is not about being better than someone else.",
  "The hardest lift is lifting your butt off the couch.",
  "Strength doesn't come from what you can do."
];

function renderStaticQuote() {
  var q = STATIC_QUOTES[today.getDate() % STATIC_QUOTES.length];
  document.getElementById('daily-quote').textContent = '“' + q + '”';
}

function loadFromLocalSettings() {
  var saved = JSON.parse(localStorage.getItem('reprise_settings') || '{}');
  if (saved.programName) document.getElementById('prog-name').value  = saved.programName;
  if (saved.startDate)   document.getElementById('start-date').value = saved.startDate;
  if (saved.duration)    document.getElementById('duration').value   = saved.duration;
  updateProgress();
  renderHabitDots([false,false,false,false,false,false,false]);
}

function saveSettings() {
  var settings = {
    programName: document.getElementById('prog-name').value,
    startDate:   document.getElementById('start-date').value,
    duration:    document.getElementById('duration').value
  };
  localStorage.setItem('reprise_settings', JSON.stringify(settings));
  updateProgress();
  alert('Settings saved locally.\n\nTo sync permanently, update the USERS tab in your RepRise Google Sheet.');
}

// ─── START ────────────────────────────────────────────────────────────────────
fetchLiveData();
</script>
</body>
</html>
