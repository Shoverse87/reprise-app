<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rest Timer — RepRise</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#141414;font-family:system-ui,sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column;padding:24px 20px}
.back-link{color:#2ECC71;font-size:13px;font-weight:600;text-decoration:none;display:block;margin-bottom:auto;padding-bottom:16px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px}
.title{font-size:11px;color:#555;letter-spacing:0.08em;text-transform:uppercase}
.ring-wrap{position:relative;width:220px;height:220px}
svg.ring{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#2a2a2a;stroke-width:8}
.ring-fill{fill:none;stroke:#2ECC71;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 0.9s linear}
.ring-done .ring-fill{stroke:#2ECC71}
.digits{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:700;letter-spacing:2px}
.ring-done .digits{color:#2ECC71}
.presets{display:flex;gap:8px}
.preset-btn{flex:1;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:10px;padding:10px 6px;color:#aaa;font-size:13px;font-weight:600;cursor:pointer;min-width:52px}
.preset-btn.active{background:#1a2e1f;border-color:#2ECC71;color:#2ECC71}
.controls{display:flex;gap:10px;width:100%;max-width:280px}
.btn-start{flex:1;background:#2ECC71;color:#0a2e18;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
.btn-reset{width:52px;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:12px;font-size:22px;cursor:pointer;color:#aaa}
</style>
</head>
<body>

<a href="https://www.appsheet.com/start/20fa3d9c-def5-4fa9-a1a5-35003b4bdbe7" class="back-link">← Back to RepRise</a>

<div class="center">
  <div class="title">Rest Timer</div>

  <div class="ring-wrap" id="ring-wrap">
    <svg class="ring" width="220" height="220" viewBox="0 0 220 220">
      <circle class="ring-bg" cx="110" cy="110" r="100"/>
      <circle class="ring-fill" id="ring-fill" cx="110" cy="110" r="100"
        stroke-dasharray="628" stroke-dashoffset="0"/>
    </svg>
    <div class="digits" id="digits">1:00</div>
  </div>

  <div class="presets">
    <button class="preset-btn" onclick="selectPreset(30,this)">30s</button>
    <button class="preset-btn active" onclick="selectPreset(60,this)">60s</button>
    <button class="preset-btn" onclick="selectPreset(90,this)">90s</button>
    <button class="preset-btn" onclick="selectPreset(120,this)">2m</button>
    <button class="preset-btn" onclick="selectPreset(180,this)">3m</button>
  </div>

  <div class="controls">
    <button class="btn-start" id="btn-start" onclick="toggleTimer()">Start</button>
    <button class="btn-reset" onclick="resetTimer()">↺</button>
  </div>
</div>

<script>
var CIRCUMFERENCE = 628;
var timerTotal     = 60;
var timerRemaining = 60;
var timerTick      = null;
var timerRunning   = false;

function fmtTime(s) {
  return Math.floor(s/60) + ':' + (s%60 < 10 ? '0' : '') + (s%60);
}

function updateRing() {
  var pct    = timerRemaining / timerTotal;
  var offset = CIRCUMFERENCE * (1 - pct);
  document.getElementById('ring-fill').style.strokeDashoffset = offset;
}

function selectPreset(secs, el) {
  if (timerRunning) return;
  timerTotal = secs; timerRemaining = secs;
  document.querySelectorAll('.preset-btn').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active');
  document.getElementById('digits').textContent = fmtTime(secs);
  document.getElementById('ring-fill').style.strokeDashoffset = 0;
  document.getElementById('ring-wrap').classList.remove('ring-done');
  document.getElementById('btn-start').textContent = 'Start';
}

function toggleTimer() {
  if (timerRemaining === 0) { resetTimer(); return; }
  timerRunning = !timerRunning;
  document.getElementById('btn-start').textContent = timerRunning ? 'Pause' : 'Resume';
  if (timerRunning) {
    timerTick = setInterval(function() {
      timerRemaining--;
      document.getElementById('digits').textContent = fmtTime(timerRemaining);
      updateRing();
      if (timerRemaining <= 0) {
        clearInterval(timerTick); timerRunning = false;
        document.getElementById('btn-start').textContent = 'Restart';
        document.getElementById('ring-wrap').classList.add('ring-done');
        playDoneBeep();
      }
    }, 1000);
  } else {
    clearInterval(timerTick);
  }
}

function resetTimer() {
  clearInterval(timerTick); timerRunning = false; timerRemaining = timerTotal;
  document.getElementById('digits').textContent = fmtTime(timerTotal);
  document.getElementById('ring-fill').style.strokeDashoffset = 0;
  document.getElementById('ring-wrap').classList.remove('ring-done');
  document.getElementById('btn-start').textContent = 'Start';
}

function playDoneBeep() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25, 0.5].forEach(function(t) {
      var osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880; osc.type = 'sine';
      gain.gain.setValueAtTime(0.8, ctx.currentTime + t);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.25);
      osc.start(ctx.currentTime + t); osc.stop(ctx.currentTime + t + 0.3);
    });
  } catch(e) {}
}
</script>
</body>
</html>
